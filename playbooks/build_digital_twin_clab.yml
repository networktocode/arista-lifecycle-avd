---
# The containerlab digital twin's variant of the DC1 build: the configs the twin boots and the
# structured configs its ANTA catalogs come from. build.yml imports this after the production
# build; the twin workflow runs it on its own because the twin never uses the production variant.
- name: Build DC1 configuration and documentation (clab digital twin)
  hosts: "{{ target }}"
  connection: local
  gather_facts: false
  vars_files:
    - "../digital_twin/clab/VARS_OVERRIDE.yml"
  vars:
    output_dir_name: "digital_twins/clab/intended"
    documentation_dir_name: "digital_twins/clab/documentation"
    avd_digital_twin_mode: true
  tasks:
    - name: Generate AVD structured configurations and fabric documentation
      ansible.builtin.import_role:
        name: arista.avd.eos_designs
    - name: Generate device configurations and documentation
      ansible.builtin.import_role:
        name: arista.avd.eos_cli_config_gen
