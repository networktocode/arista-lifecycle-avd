---
- name: Build DC1 configuration and documentation (production)
  hosts: "{{ target }}"
  connection: local
  gather_facts: false
  tasks:
    - name: Generate AVD structured configurations and fabric documentation
      ansible.builtin.import_role:
        name: arista.avd.eos_designs
    - name: Generate device configurations and documentation
      ansible.builtin.import_role:
        name: arista.avd.eos_cli_config_gen
    - name: Generate the AVD amplification report
      ansible.builtin.import_role:
        name: avd_intent_report

- name: Build DC1 configuration and documentation (clab digital twin)
  ansible.builtin.import_playbook: build_digital_twin_clab.yml
