---
_metadata:
  name: "AVD Fabric Settings"
  description: "Fabric-wide AVD knobs; Nautobot renders this file to sites/_global_vars/fabric_settings.yml"
  weight: 500
  is_active: true
  platforms:
    - name: "Arista EOS"
# Platform uplink standards for DC1-mini (7500R3 spines, 7050X3 leaves)
default_interfaces:
  - types: [spine]
    platforms: ['7500R3']
    downlink_interfaces: [Ethernet1/1-48]
  - types: [l3leaf]
    platforms: [7050X3]
    uplink_interfaces: [Ethernet49/1, Ethernet50/1]
    mlag_interfaces: [Ethernet51/1, Ethernet52/1]
    downlink_interfaces: [Ethernet53/1, Ethernet54/1]
# Reuse the same IP for MLAG L2 and L3 peering
fabric_ip_addressing:
  mlag:
    algorithm: same_subnet
# BGP peer group password (lab value, public in Arista's 0-to-hero repo)
bgp_peer_groups:
  ipv4_underlay_peers:
    name: IPv4-UNDERLAY-PEERS
    password: 'AQQvKeimxJu+uGQ/yYvv9w=='
bgp_distance:
  external_routes: 20
  internal_routes: 200
  local_routes: 200
bgp_graceful_restart:
  enabled: true
  restart_time: 300
# Node ids come from Nautobot (avd_node_id), so no pool manager
generate_cv_tags:
  topology_hints: true
