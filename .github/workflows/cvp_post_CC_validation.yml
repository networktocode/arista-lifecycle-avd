---
# Validate production DC1 after a CloudVision change control finishes.
# CloudVision (or whatever watches the change control) posts a
# repository_dispatch of type validation_trigger to this repository:
#
#   gh api repos/:owner/:repo/dispatches -f event_type=validation_trigger
#
# repository_dispatch always runs on the default branch, so this validates what
# is on main, which is what the change control just pushed to the fabric.
name: Validate production after change control

on:
  repository_dispatch:
    types: [validation_trigger]

jobs:
  Network-validation:
    env:
      ANSIBLE_COLLECTIONS_PATH: /home/avd/.ansible/collections/ansible_collections
    timeout-minutes: 15
    runs-on: [self-hosted, clab]
    permissions:
      contents: write
    container:
      image: "ghcr.io/aristanetworks/avd/universal:python3.13-avd-v6.3.0"
      options: '--user=root --network host'
      env:
        PYTHONPATH: "/home/avd/.local/lib/python3.13/site-packages"
    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: add the repo to git safe directory
        run: 'git config --global --add safe.directory "$GITHUB_WORKSPACE"'

      - name: Pin ANTA 1.9.0
        # The image ships anta 1.8.0 under /home/avd/.local, which the job's PYTHONPATH
        # puts ahead of system site-packages; the upgrade must land in that directory
        # or the old version silently wins. The assert makes shadowing a loud failure.
        run: |
          python3 -m pip install --quiet --upgrade --target /home/avd/.local/lib/python3.13/site-packages "anta==1.9.0"
          python3 -c 'import anta; assert anta.__version__ == "1.9.0", anta.__version__; print("anta", anta.__version__)'

      - name: run DC1 validation
        run: ansible-playbook playbooks/validate.yml -i sites/DC1/inventory.yml -e 'target=DC1'
        id: dc1-validation
        continue-on-error: true
        env:
          # A repository variable, not a secret: it is a username, and as a
          # secret GitHub would mask the string "anta" in every log line of
          # every job in this repository.
          ANTA_USERNAME: ${{ vars.ANTA_USERNAME || 'anta' }}
          ANTA_PASSWORD: ${{ secrets.ANTA_PASSWORD }}

      - name: commit the test catalogs and report to the repository
        run: |
          if [[ -n $(git status --porcelain) ]]; then
            git config --local user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git config --local user.name "github-actions[bot]"
            git add --all
            git commit -m "Automatic update of the validation report after change control [skip ci]"
            git pull --rebase origin "$BRANCH"
            git push origin HEAD:"$BRANCH"
          else
            echo "WARNING: No changes were detected. git commit push action aborted."
          fi
        shell: bash
        env:
          BRANCH: ${{ github.ref_name }}
