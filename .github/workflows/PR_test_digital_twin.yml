---
# Validate every pull request against a throwaway containerlab digital twin of
# DC1 before the change is allowed near production.
#
# Prerequisite: a digital twin lab must already be running on the containerlab
# host (Nautobot's "Deploy Twin & Publish PR" job for DC1 starts one).
# digital_twin/clab/twin_inventory.py asks the containerlab API server which
# labs are up and exits 2 when the only lab is production, which fails this
# workflow fast with a message saying what to launch.
#
# Forks are deliberately not supported: a pull_request run from a fork gets no
# secrets and a read-only token, so it could neither reach the twin nor commit
# the report. Every job skips unless the head branch lives in this repository,
# and pull_request_target is never used.
name: Deploy & test configurations in the digital twin

on:
  pull_request:
    types: [opened, synchronize, reopened]

# There is one digital twin on the containerlab host, so twin runs queue
# repository-wide rather than per branch, and a run is never cancelled: a
# cancelled `replace: config` leaves the twin half configured, and the next run
# would validate that instead of the pull request.
concurrency:
  group: twin-dc1
  cancel-in-progress: false

jobs:
  deploy-twin:
    if: github.event.pull_request.head.repo.full_name == github.repository
    env:
      ANSIBLE_COLLECTIONS_PATH: /home/avd/.ansible/collections/ansible_collections
    timeout-minutes: 15
    runs-on: [self-hosted, "lab-${{ vars.NAUTOBOT_LAB_ID }}"]
    permissions:
      contents: read
      pull-requests: read
    outputs:
      output_dc1: ${{ steps.dc1-deploy.outcome }}
    container:
      image: "ghcr.io/aristanetworks/avd/universal:python3.13-avd-v6.3.0"
      options: '--user=root --add-host=host.docker.internal:host-gateway'
      env:
        PYTHONPATH: "/home/avd/.local/lib/python3.13/site-packages"
    steps:
      # The pull request head, not the merge commit: the twin is deployed from
      # the branch's own artifacts and the report is committed back to it.
      - name: Checkout
        uses: actions/checkout@v6
        with:
          ref: ${{ github.head_ref }}

      - name: add the repo to git safe directory
        run: 'git config --global --add safe.directory "$GITHUB_WORKSPACE"'

      - name: Check DC1 paths for AVD variable changes
        uses: dorny/paths-filter@v4
        id: filter-dc1
        with:
          filters: |
            workflows:
              - 'sites/DC1/group_vars/**'
              - 'sites/_global_vars/**'

      # The twin never uses the production variant, which the Build feature branch
      # workflow renders and commits, so only the twin's is built, and only here:
      # Network-validation takes this build as an artifact instead of rebuilding.
      - name: Build the DC1 digital twin's configuration
        run: make dc1-build-twin
        id: build-twin
        if: steps.filter-dc1.outputs.workflows == 'true'

      - name: Redeploy the digital twin with the pull request's configuration
        # Startup configuration is applied ungated at boot, unlike runtime sessions,
        # which cEOS-lab gates behind platform capabilities. The make target discovers
        # the running twin through the API server, embeds the built configs as inline
        # startup configs, redeploys the lab in place, and waits for every eAPI.
        run: make dc1-deploy-twin
        id: dc1-deploy
        if: steps.build-twin.outcome == 'success'
        env:
          CLAB_JWT_SECRET: ${{ secrets.CLAB_JWT_SECRET }}

      - name: Hand the twin build to Network-validation
        if: steps.dc1-deploy.outcome == 'success'
        uses: actions/upload-artifact@v7
        with:
          name: dc1-twin-build
          path: sites/DC1/digital_twins/
          if-no-files-found: error
          retention-days: 1

  Network-validation:
    if: ${{ github.event.pull_request.head.repo.full_name == github.repository && needs.deploy-twin.outputs.output_dc1 == 'success' }}
    needs: deploy-twin
    env:
      ANSIBLE_COLLECTIONS_PATH: /home/avd/.ansible/collections/ansible_collections
    timeout-minutes: 15
    runs-on: [self-hosted, "lab-${{ vars.NAUTOBOT_LAB_ID }}"]
    permissions:
      contents: write
    outputs:
      anta_outcome: ${{ steps.dc1-validation.outcome }}
    container:
      image: "ghcr.io/aristanetworks/avd/universal:python3.13-avd-v6.3.0"
      options: '--user=root --add-host=host.docker.internal:host-gateway'
      env:
        PYTHONPATH: "/home/avd/.local/lib/python3.13/site-packages"
    steps:
      - name: Checkout
        uses: actions/checkout@v6
        with:
          ref: ${{ github.head_ref }}

      - name: add the repo to git safe directory
        run: 'git config --global --add safe.directory "$GITHUB_WORKSPACE"'

      # This job runs in its own container with its own clean checkout. The twin
      # build arrives from deploy-twin as an artifact, so it is not rebuilt.
      - name: Take the twin build from deploy-twin
        uses: actions/download-artifact@v8
        with:
          name: dc1-twin-build
          path: sites/DC1/digital_twins

      - name: Find the running DC1 digital twin
        run: |
          python3 digital_twin/clab/twin_inventory.py \
            --api http://host.docker.internal:8080 \
            --jwt-secret-env CLAB_JWT_SECRET \
            --production dc1 \
            --out twin_inventory.yml
        id: twin-inventory-dc1
        env:
          CLAB_JWT_SECRET: ${{ secrets.CLAB_JWT_SECRET }}

      - name: Pin ANTA 1.9.0
        # The image ships anta 1.8.0 under /home/avd/.local, which the job's PYTHONPATH
        # puts ahead of system site-packages. pip's --target does not replace an existing
        # package's files, so the old version is uninstalled first and 1.9.0 installed
        # clean into that same directory; the assert makes any shadowing a loud failure.
        run: |
          python3 -m pip uninstall --quiet --yes anta
          python3 -m pip install --quiet --target /home/avd/.local/lib/python3.13/site-packages "anta==1.9.0"
          python3 -c 'import anta; assert anta.__version__ == "v1.9.0", anta.__version__; print("anta", anta.__version__)'

      - name: run DC1 validation
        run: make dc1-validate-twin
        id: dc1-validation
        continue-on-error: true

      - name: commit the test catalogs and report to the repository
        run: |
          if [[ -n $(git status --porcelain) ]]; then
            git config --local user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git config --local user.name "github-actions[bot]"
            git add --all
            git commit -m "Automatic update of the validation report on digital twin for Processing Pull Request #${PR_NUMBER} [skip ci]"
            git pull --rebase origin "$BRANCH"
            git push origin HEAD:"$BRANCH"
          else
            echo "WARNING: No changes were detected. git commit push action aborted."
          fi
        shell: bash
        env:
          BRANCH: ${{ github.head_ref }}
          PR_NUMBER: ${{ github.event.pull_request.number }}

      - name: Fail the check if DC1 validation failed
        if: always() && steps.dc1-validation.outcome == 'failure'
        run: exit 1

  PR-comment:
    # The twin's counterpart to the production workflow's Release-notes job: it posts the
    # report Network-validation committed to the pull request branch, whether validation
    # passed or failed.
    if: ${{ always() && github.event.pull_request.head.repo.full_name == github.repository && (needs.Network-validation.outputs.anta_outcome == 'success' || needs.Network-validation.outputs.anta_outcome == 'failure') }}
    needs: [deploy-twin, Network-validation]
    timeout-minutes: 15
    runs-on: [self-hosted, "lab-${{ vars.NAUTOBOT_LAB_ID }}"]
    permissions:
      contents: read
      pull-requests: write
    container:
      image: "ghcr.io/aristanetworks/avd/universal:python3.13-avd-v6.3.0"
      options: '--user=root --add-host=host.docker.internal:host-gateway'
      env:
        PYTHONPATH: "/home/avd/.local/lib/python3.13/site-packages"
    steps:
      - name: Checkout
        uses: actions/checkout@v6
        with:
          ref: ${{ github.head_ref }}

      - name: Prepare DC1 ANTA report
        run: |
          echo "# DC1 - Digital Twin Network Validation Report" > /tmp/dc1-comment.md
          echo "" >> /tmp/dc1-comment.md
          if [ -f sites/DC1/anta_digital_twin/clab/reports/anta_report.md ]; then
            cat sites/DC1/anta_digital_twin/clab/reports/anta_report.md >> /tmp/dc1-comment.md
          else
            echo "validation produced no report; check the workflow logs" >> /tmp/dc1-comment.md
          fi

      - name: Post DC1 ANTA report as PR comment
        uses: marocchino/sticky-pull-request-comment@v2
        with:
          header: dc1-anta-report
          path: /tmp/dc1-comment.md
