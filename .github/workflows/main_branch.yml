---
# Deploy DC1 to production through CloudVision as a Service when a change lands
# on main, then validate the fabric with ANTA and commit the report back.
name: Deploy & test configurations

on:
  push:
    branches:
      - main

jobs:
  deploy-prod:
    env:
      ANSIBLE_COLLECTIONS_PATH: /home/avd/.ansible/collections/ansible_collections
    timeout-minutes: 15
    runs-on: [self-hosted, clab]
    permissions:
      contents: read
    outputs:
      output_dc1: ${{ steps.dc1-deploy.outcome }}
    container:
      image: "ghcr.io/aristanetworks/avd/universal:python3.13-avd-v6.3.0"
      options: '--user=root --add-host=host.docker.internal:host-gateway'
      env:
        PYTHONPATH: "/home/avd/.local/lib/python3.13/site-packages"
    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: add the repo to git safe directory
        run: 'git config --global --add safe.directory "$GITHUB_WORKSPACE"'

      - name: Check DC1 paths for AVD variable changes
        uses: dorny/paths-filter@v4
        id: filter-dc1
        with:
          filters: |
            workflows:
              - 'sites/DC1/group_vars/**'
              - 'sites/_global_vars/**'

      - name: Deploy configuration for the DC1 fabric
        id: dc1-deploy
        run: ansible-playbook playbooks/deploy.yml -i sites/DC1/inventory.yml -e 'target=DC1 cv_submit_workspace=true cv_run_change_control=true'
        if: steps.filter-dc1.outputs.workflows == 'true'
        env:
          CVAAS_SERVER: ${{ secrets.CVAAS_SERVER }}
          CVAAS_TOKEN: ${{ secrets.CVAAS_TOKEN }}

  Network-validation:
    if: ${{ needs.deploy-prod.outputs.output_dc1 == 'success' }}
    needs: deploy-prod
    env:
      ANSIBLE_COLLECTIONS_PATH: /home/avd/.ansible/collections/ansible_collections
    timeout-minutes: 15
    runs-on: [self-hosted, clab]
    permissions:
      contents: write
    container:
      image: "ghcr.io/aristanetworks/avd/universal:python3.13-avd-v6.3.0"
      options: '--user=root --add-host=host.docker.internal:host-gateway'
      env:
        PYTHONPATH: "/home/avd/.local/lib/python3.13/site-packages"
    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: add the repo to git safe directory
        run: 'git config --global --add safe.directory "$GITHUB_WORKSPACE"'

      - name: Pin ANTA 1.9.0
        # The image ships anta 1.8.0 under /home/avd/.local, which the job's PYTHONPATH
        # puts ahead of system site-packages. pip's --target does not replace an existing
        # package's files, so the old version is uninstalled first and 1.9.0 installed
        # clean into that same directory; the assert makes any shadowing a loud failure.
        run: |
          python3 -m pip uninstall --quiet --yes anta
          python3 -m pip install --quiet --target /home/avd/.local/lib/python3.13/site-packages "anta==1.9.0"
          python3 -c 'import anta; assert anta.__version__ == "v1.9.0", anta.__version__; print("anta", anta.__version__)'

      - name: run DC1 validation
        run: ansible-playbook playbooks/validate.yml -i sites/DC1/inventory.yml -e 'target=DC1'
        id: dc1-validation
        continue-on-error: true
        env:
          # A repository variable, not a secret: it is a username, and as a
          # secret GitHub would mask the string "anta" in every log line of
          # every job in this repository.
          ANTA_USERNAME: ${{ vars.ANTA_USERNAME || 'anta' }}
          ANTA_PASSWORD: ${{ secrets.ANTA_PASSWORD }}

      - name: commit the test catalogs and report to the repository
        run: |
          if [[ -n $(git status --porcelain) ]]; then
            git config --local user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git config --local user.name "github-actions[bot]"
            git add --all
            git commit -m "Automatic update of the validation report after pipeline execution [skip ci]"
            git pull --rebase origin "$BRANCH"
            git push origin HEAD:"$BRANCH"
          else
            echo "WARNING: No changes were detected. git commit push action aborted."
          fi
        shell: bash
        env:
          BRANCH: ${{ github.ref_name }}
