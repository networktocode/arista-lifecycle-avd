---
# Deploy DC1 to production through CloudVision as a Service when a release is
# published, validate the fabric with ANTA, commit the report to main, and add
# the results to the release notes.
name: Deploy & test configurations

on:
  release:
    types: [published]

jobs:
  deploy-prod:
    env:
      ANSIBLE_COLLECTIONS_PATH: /home/avd/.ansible/collections/ansible_collections
    timeout-minutes: 15
    runs-on: [self-hosted, clab]
    permissions:
      contents: read
    outputs:
      output_dc1: ${{ steps.dc1-deploy.outcome }}
    container:
      image: "ghcr.io/aristanetworks/avd/universal:python3.13-avd-v6.3.0"
      options: '--user=root --add-host=host.docker.internal:host-gateway'
      env:
        PYTHONPATH: "/home/avd/.local/lib/python3.13/site-packages"
    steps:
      - name: Checkout the release
        uses: actions/checkout@v6
        with:
          ref: ${{ github.event.release.tag_name }}

      - name: add the repo to git safe directory
        run: 'git config --global --add safe.directory "$GITHUB_WORKSPACE"'

      # One CloudVision tenant can hold many labs' dc1-spine1 and stale records of earlier ones,
      # so AVD must not match switches by hostname. Nautobot tags every switch it boots with its
      # deployment and lab; this hands AVD the tagged switches' serials for this run only.
      - name: Find the DC1 switches in CloudVision by their Nautobot tags
        run: python3 cloudvision/serials_from_tags.py --deployment DC1 --lab "$NAUTOBOT_LAB_ID" --structured-configs sites/DC1/intended/structured_configs
        env:
          NAUTOBOT_LAB_ID: ${{ vars.NAUTOBOT_LAB_ID }}
          CVAAS_SERVER: ${{ secrets.CVAAS_SERVER }}
          CVAAS_TOKEN: ${{ secrets.CVAAS_TOKEN }}

      - name: Deploy configuration for the DC1 fabric
        id: dc1-deploy
        run: ansible-playbook playbooks/deploy.yml -i sites/DC1/inventory.yml -e 'target=DC1 cv_submit_workspace=true cv_run_change_control=true'
        env:
          CVAAS_SERVER: ${{ secrets.CVAAS_SERVER }}
          CVAAS_TOKEN: ${{ secrets.CVAAS_TOKEN }}

  Network-validation:
    if: ${{ needs.deploy-prod.outputs.output_dc1 == 'success' }}
    needs: deploy-prod
    env:
      ANSIBLE_COLLECTIONS_PATH: /home/avd/.ansible/collections/ansible_collections
    timeout-minutes: 15
    runs-on: [self-hosted, clab]
    permissions:
      contents: write
    outputs:
      anta_outcome: ${{ steps.dc1-validation.outcome }}
    container:
      image: "ghcr.io/aristanetworks/avd/universal:python3.13-avd-v6.3.0"
      options: '--user=root --add-host=host.docker.internal:host-gateway'
      env:
        PYTHONPATH: "/home/avd/.local/lib/python3.13/site-packages"
    steps:
      - name: Checkout main
        uses: actions/checkout@v6
        with:
          ref: main

      - name: add the repo to git safe directory
        run: 'git config --global --add safe.directory "$GITHUB_WORKSPACE"'

      - name: Pin ANTA 1.9.0
        # The image ships anta 1.8.0 under /home/avd/.local, which the job's PYTHONPATH
        # puts ahead of system site-packages. pip's --target does not replace an existing
        # package's files, so the old version is uninstalled first and 1.9.0 installed
        # clean into that same directory; the assert makes any shadowing a loud failure.
        run: |
          python3 -m pip uninstall --quiet --yes anta
          python3 -m pip install --quiet --target /home/avd/.local/lib/python3.13/site-packages "anta==1.9.0"
          python3 -c 'import anta; assert anta.__version__ == "v1.9.0", anta.__version__; print("anta", anta.__version__)'

      - name: run DC1 validation
        run: ansible-playbook playbooks/validate.yml -i sites/DC1/inventory.yml -e 'target=DC1'
        id: dc1-validation
        continue-on-error: true
        env:
          # A repository variable, not a secret: it is a username, and as a
          # secret GitHub would mask the string "anta" in every log line of
          # every job in this repository.
          ANTA_USERNAME: ${{ vars.ANTA_USERNAME || 'anta' }}
          ANTA_PASSWORD: ${{ secrets.ANTA_PASSWORD }}

      - name: commit the test catalogs and report to main
        run: |
          if [[ -n $(git status --porcelain) ]]; then
            git config --local user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git config --local user.name "github-actions[bot]"
            git add --all
            git commit -m "Production validation report for ${TAG} [skip ci]"
            git pull --rebase origin main
            git push origin HEAD:main
          else
            echo "No report changes to commit."
          fi
        shell: bash
        env:
          TAG: ${{ github.event.release.tag_name }}

  Release-notes:
    # Runs on the host, not in the AVD container, and never checks out the repository: the
    # container jobs leave root-owned files in the runner's work folder that a host job cannot
    # clean. The ANTA report is read from main through the API instead.
    if: ${{ always() }}
    needs: [deploy-prod, Network-validation]
    runs-on: [self-hosted, clab]
    permissions:
      contents: write
    steps:
      - name: Add the production results to the release
        uses: actions/github-script@v7
        env:
          TAG: ${{ github.event.release.tag_name }}
          DEPLOY: ${{ needs.deploy-prod.result }}
          VALIDATION: ${{ needs.Network-validation.outputs.anta_outcome || 'skipped' }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
        with:
          script: |
            const { owner, repo } = context.repo;
            const tag = process.env.TAG;

            const { data: release } = await github.rest.repos.getReleaseByTag({ owner, repo, tag });

            const lines = [
              release.body || "",
              "",
              "## Production",
              "",
              `- CloudVision change control: ${process.env.DEPLOY}`,
              `- Production ANTA run: ${process.env.VALIDATION}`,
              `- Run: ${process.env.RUN_URL}`,
            ];

            // Only this run's validation commits a fresh report; when it did not run, the report
            // on main belongs to an earlier release and stays out of these notes.
            if (process.env.VALIDATION !== "skipped") {
              let report = "";
              try {
                const { data } = await github.rest.repos.getContent({
                  owner,
                  repo,
                  path: "sites/DC1/anta/reports/anta_report.md",
                  ref: "main",
                });
                report = Buffer.from(data.content, "base64").toString("utf8");
              } catch (error) {
                core.warning(`No ANTA report on main to summarize: ${error.message}`);
              }
              const reportLines = report.split("\n");
              // The table of contents also has a "Summary Totals" bullet; the real section is the
              // heading line itself, which starts with "#".
              const start = reportLines.findIndex(
                (line) => line.trimStart().startsWith("#") && line.includes("Summary Totals")
              );
              if (start !== -1) {
                let i = start + 1;
                while (i < reportLines.length && reportLines[i].trim() === "") {
                  i += 1;
                }
                const summary = [];
                while (i < reportLines.length && reportLines[i].trimStart().startsWith("|") && summary.length < 8) {
                  summary.push(reportLines[i]);
                  i += 1;
                }
                if (summary.length > 0) {
                  lines.push("", ...summary);
                }
              }
            }

            await github.rest.repos.updateRelease({
              owner,
              repo,
              release_id: release.id,
              body: lines.join("\n"),
            });
