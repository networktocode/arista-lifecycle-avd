---
# Build the AVD artifacts for every push to a branch other than main and commit
# them back, so the intended configs, documentation, and twin configs in the
# branch always match the group_vars that produced them.
name: Build feature branch

on:
  push:
    branches-ignore:
      - main

jobs:
  Build:
    env:
      ANSIBLE_COLLECTIONS_PATH: /home/avd/.ansible/collections/ansible_collections
    timeout-minutes: 4
    runs-on: [self-hosted, clab]
    permissions:
      contents: write
    container:
      image: "ghcr.io/aristanetworks/avd/universal:python3.13-avd-v6.3.0"
      # root is the only user GitHub Actions allows in a job container; the
      # runner attaches its own bridge network to the job container, so the
      # host-gateway alias reaches the containerlab API server on the runner
      # host, and the host's forwarding rules route the job to the lab
      # subnets on the runner's droplet.
      options: '--user=root --add-host=host.docker.internal:host-gateway'
      env:
        PYTHONPATH: "/home/avd/.local/lib/python3.13/site-packages"
    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: add the repo to git safe directory
        run: 'git config --global --add safe.directory "$GITHUB_WORKSPACE"'

      - name: Check site paths for AVD variable changes
        uses: dorny/paths-filter@v4
        id: filter-sites
        with:
          filters: |
            workflows:
              - 'sites/*/group_vars/**'
              - 'sites/*/inventory.yml'
              - 'sites/_global_vars/**'

      - name: Build configuration for every site
        run: |
          for inventory in sites/*/inventory.yml; do
            site="$(basename "$(dirname "$inventory")")"
            make build SITE="$site"
          done
        id: build-sites
        if: steps.filter-sites.outputs.workflows == 'true'

      - name: commit the changes if the build changed files
        run: |
          if [[ -n $(git status --porcelain) ]]; then
            git config --local user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git config --local user.name "github-actions[bot]"
            git add --all
            git commit -m "Build update from pipeline execution [skip ci]"
            git pull --rebase origin "$BRANCH"
            git push origin HEAD:"$BRANCH"
          else
            echo "WARNING: No changes were detected. git commit push action aborted."
          fi
        shell: bash
        env:
          BRANCH: ${{ github.ref_name }}
        if: steps.filter-sites.outputs.workflows == 'true'
