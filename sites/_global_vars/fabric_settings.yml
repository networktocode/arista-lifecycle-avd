---
bgp_distance:
  local_routes: 200
  external_routes: 20
  internal_routes: 200
bgp_peer_groups:
  ipv4_underlay_peers:
    name: IPv4-UNDERLAY-PEERS
    password: AQQvKeimxJu+uGQ/yYvv9w==
generate_cv_tags:
  topology_hints: true
default_interfaces:
  - types:
      - spine
    platforms:
      - 7500R3
    downlink_interfaces:
      - Ethernet1/1-48
  - types:
      - l3leaf
    platforms:
      - 7050X3
    mlag_interfaces:
      - Ethernet51/1
      - Ethernet52/1
    uplink_interfaces:
      - Ethernet49/1
      - Ethernet50/1
    downlink_interfaces:
      - Ethernet53/1
      - Ethernet54/1
bgp_graceful_restart:
  enabled: true
  restart_time: 300
fabric_ip_addressing:
  mlag:
    algorithm: same_subnet
custom_platform_settings:
  - platforms:
      - 7500R3
    digital_twin:
      platform: vEOS-lab
    reload_delay:
      mlag: 900
      non_mlag: 1020
    feature_support:
      private_vlan: false
      errdisable_causes:
        acl:
          recovery: false
        tpid:
          recovery: false
          detection: false
        dot1x_coa:
          recovery: false
          detection: false
        stuck_queue:
          recovery: false
        port_breakout:
          recovery: false
          detection: false
        storm_control:
          recovery: false
          detection: false
        internal_error:
          recovery: false
          detection: false
        interface_speed:
          recovery: false
          detection: false
        fabric_capacity_low:
          recovery: false
          detection: false
        transceiver_adapter:
          recovery: false
          detection: false
        hardware_speed_group:
          recovery: false
          detection: false
        switchcard_unreachable:
          recovery: false
          detection: false
        error_correction_encoding:
          recovery: false
          detection: false
        dot1x_phone_classification:
          recovery: false
          detection: false
      per_interface_l2_mtu: false
      evpn_gateway_rd_rt_rewrite: true
      subinterface_monitor_session: false
      evpn_gateway_all_active_multihoming: true
    management_interface: Management0
