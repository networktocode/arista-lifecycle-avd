---
bgp_session_state:
  display_name: "BGP Session State"
  rule_type: "exact_match"
  description: "The BGP sessions that are not established are the same before and after the change."
  collectors:
    # Only the unhealthy sessions, named by their AVD description. A change that adds sessions (a new tenant VRF's MLAG
    # peering) leaves the list as it was, while a session that drops adds its name. Comparing the whole table failed every
    # intended addition, and the Nautobot intent checks now verify the designed session counts. The route table size is
    # still compared by Route Count. `exclude` is written empty because the datasource only updates the keys present here.
    - name: "json"
      platform: "arista_eos"
      command: "show ip bgp summary vrf all | json"
      jmespath: "[{bgp: {not_established: sort(values(vrfs)[*].values(peers)[] | [?peerState != 'Established'].description)}}]"
      exclude: []
interface_health:
  display_name: "Interface Health"
  rule_type: "exact_match"
  description: "The enabled interfaces that are not up are the same before and after the change."
  collectors:
    # Only the unhealthy interfaces, by name, for the same reason as BGP Session State: a tenant's new SVIs leave the list
    # as it was, an interface going down adds its name. NAPALM's get_interfaces has no name field to filter on, hence the
    # JSON command. `napalm_getter` and `exclude` are written empty because the datasource only updates the keys present.
    - name: "json"
      platform: "arista_eos"
      command: "show interfaces | json"
      napalm_getter: ""
      jmespath: "[{interfaces: {not_up: sort(values(interfaces)[?interfaceStatus != 'disabled' && lineProtocolStatus != 'up'].name)}}]"
      exclude: []
mlag_state:
  display_name: "MLAG State"
  rule_type: "exact_match"
  description: "The MLAG domain stays active with a healthy peer negotiation."
  collectors:
    - name: "json"
      platform: "arista_eos"
      command: "show mlag | json"
      jmespath: "{state: state, negStatus: negStatus}"
route_count:
  display_name: "Route Count"
  rule_type: "tolerance"
  description: "The routing table size stays within ten percent of the baseline."
  evaluate_args:
    tolerance: 10
  collectors:
    - name: "json"
      platform: "arista_eos"
      command: "show ip route summary | json"
      jmespath: "[{routes: {total: vrfs.default.totalRoutes}}]"
