---
bgp_session_state:
  display_name: "BGP Session State"
  rule_type: "exact_match"
  description: "Every BGP neighbor stays established with a stable prefix count."
  collectors:
    # JSON keyed by VRF and neighbour instead of the TextFSM row list: jdiff only pairs anchored list items by name when
    # both lists have the same length, so a neighbour added or removed by the change produced a positional diff.
    # The excludes keep exactly what the original compared: peer state and received prefixes.
    - name: "json"
      platform: "arista_eos"
      command: "show ip bgp summary vrf all | json"
      jmespath: ""   # raw mode: required (empty) when `exclude` is used; the datasource only writes keys present here
      exclude: ["msgReceived", "msgSent", "inMsgQueue", "outMsgQueue", "upDownTime", "version", "asn", "description", "underMaintenance", "prefixAccepted", "routerId", "vrf"]
interface_health:
  display_name: "Interface Health"
  rule_type: "exact_match"
  description: "Interface admin and operational state are unchanged."
  collectors:
    - name: "napalm"
      platform: "arista_eos"
      napalm_getter: "get_interfaces"
      # dict keyed by interface (with the noisy fields excluded) rather than an anchored list: see the BGP rule above.
      jmespath: ""   # raw mode: required (empty) when `exclude` is used
      exclude: ["mtu", "speed", "last_flapped", "description", "mac_address"]
mlag_state:
  display_name: "MLAG State"
  rule_type: "exact_match"
  description: "The MLAG domain stays active with a healthy peer negotiation."
  collectors:
    - name: "json"
      platform: "arista_eos"
      command: "show mlag | json"
      jmespath: "{state: state, negStatus: negStatus}"
route_count:
  display_name: "Route Count"
  rule_type: "tolerance"
  description: "The routing table size stays within ten percent of the baseline."
  evaluate_args:
    tolerance: 10
  collectors:
    - name: "json"
      platform: "arista_eos"
      command: "show ip route summary | json"
      jmespath: "[{routes: {total: vrfs.default.totalRoutes}}]"
