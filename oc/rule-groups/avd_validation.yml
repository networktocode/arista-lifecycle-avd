---
avd_validation:
  display_name: "AVD Validation"
  description: "Post-change state validation mirroring the ANTA tests AVD generates for DC1 (pyavd 6.3.0). One-sided rules; run on a single snapshot."
  validation_rules:
    - "BGP Peer Session Established"
    - "Routing Protocol Model"
    - "Route Presence per VRF"
    - "Interfaces Status"
    - "Interface Errors"
    - "Interface Discards"
    - "No Err-Disabled Interfaces"
    - "Port-Channels Healthy"
    - "No Illegal LACP"
    - "LLDP Neighbors Present"
    - "MLAG Status Active"
    - "MLAG Interfaces"
    - "MLAG Config Sanity"
    - "VXLAN Config Sanity"
    - "NTP Synchronised"
    - "No Running/Startup Diff"
    - "No Agent Crash Logs"
    - "No Coredumps"
    - "Clean Reload Cause"
    - "Memory Free"
    - "No STP BPDU Errors"
    - "ZeroTouch Disabled"
    - "eAPI Enabled"
